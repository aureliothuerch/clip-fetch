[package]
name = "clipfetch"
version = "0.1.0"
edition = "2024"
description = "Download TikTok, Instagram and YouTube videos from the terminal, with quality selection up to 4K"
license = "MIT"
repository = "https://github.com/aureliothuerch/clip-fetch"
readme = "README.md"
keywords = ["downloader", "video", "youtube", "tiktok", "cli"]
categories = ["command-line-utilities"]
authors = ["Aurelio Thür"]

[package.metadata.wix]
upgrade-guid = "BFBBC50D-8EA9-4D5F-AED1-92C0DB5CD3B8"
path-guid = "5AF57279-07A9-4CBA-A219-9D84D9D0C3F5"
license = false
eula = false

[[bin]]
name = "cf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1"
ureq = "3.4.2"
dirs = "5"
serde_json = "1"
flate2 = "1"
ratatui = "0.30.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
