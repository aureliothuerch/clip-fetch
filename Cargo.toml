[package]
name = "clipfetch"
version = "0.1.0"
edition = "2024"
description = "Download TikTok, Instagram and YouTube videos from the terminal, with quality selection up to 4K"
license = "MIT"
repository = "https://github.com/aureliothuerch/clip-fetch"
readme = "README.md"
keywords = ["downloader", "video", "youtube", "tiktok", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "cf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1"
ureq = "3.4.2"
dirs = "5"
serde_json = "1"
flate2 = "1"
ratatui = "0.30.2"
